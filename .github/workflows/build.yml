name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 核心算法自检
        run: |
          python src/app.py --selftest
          type selftest_report.txt

      - name: 打包 exe
        run: python build/build_exe.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gwy-photo-tool-windows
          path: dist/报名照处理器.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/报名照处理器.exe
          generate_release_notes: true
